# Local Logto override configuration
# TimescaleDB itself lives in docker-compose.timescaledb.yml, which is always
# applied; this file only adds the Logto server and its database bootstrap.
# Usage:
#   - Local infra: docker compose -f docker-compose.yml -f docker-compose.timescaledb.yml -f docker-compose.local.yml up
#   - Helper script: ./run.sh up --local
services:
  backend:
    # LOGTO_ENDPOINT is the browser-facing issuer, which a container cannot
    # reach; the backend dials Logto over the compose network instead.
    environment:
      LOGTO_INTERNAL_ENDPOINT: ${LOGTO_INTERNAL_ENDPOINT:-http://logto:3001}
    depends_on:
      qdrant:
        condition: service_started

  timescaledb-init:
    environment:
      LOGTO_POSTGRES_PASSWORD_FILE: /run/secrets/logto_postgres_password
    secrets:
      - logto_postgres_password

  logto:
    image: ghcr.io/logto-io/logto:1.38.0
    depends_on:
      timescaledb-init:
        condition: service_completed_successfully
    entrypoint: ["sh", "/init/start_logto.sh"]
    ports:
      - "3011:3001"
      - "3002:3002"
    environment:
      TRUST_PROXY_HEADER: 1
      ENDPOINT: ${LOGTO_ENDPOINT}
      ADMIN_ENDPOINT: ${LOGTO_ADMIN_ENDPOINT}
      LOGTO_POSTGRES_PASSWORD_FILE: /run/secrets/logto_postgres_password
    volumes:
      - logto-connectors:/etc/logto/packages/core/connectors
      - ./sql/start_logto.sh:/init/start_logto.sh:ro
    secrets:
      - logto_postgres_password
    restart: unless-stopped

volumes:
  logto-connectors:

secrets:
  logto_postgres_password:
    environment: LOGTO_POSTGRES_PASSWORD
