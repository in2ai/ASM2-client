services:
  backend:
    environment:
      PG_HOST: timescaledb
      PG_PORT: 5432
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
    depends_on:
      qdrant:
        condition: service_started
      timescaledb:
        condition: service_healthy
      timescaledb-init:
        condition: service_completed_successfully

  timescaledb:
    image: timescale/timescaledb:2.28.3-pg18
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - timescaledb-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}

  timescaledb-init:
    image: postgres:18-alpine
    restart: "no"
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - ./sql/init_tsdb.sql:/init/init_tsdb.sql:ro
      - ./sql/init_tsdb.sh:/init/init_tsdb.sh:ro
    env_file:
      - .env
    working_dir: /init
    entrypoint: ["sh", "/init/init_tsdb.sh"]
    environment:
      LOGTO_POSTGRES_PASSWORD_FILE: /run/secrets/logto_postgres_password
      PG_HOST: timescaledb
      PG_PORT: 5432
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
    secrets:
      - logto_postgres_password

  logto:
    image: ghcr.io/logto-io/logto:1.38.0
    depends_on:
      timescaledb-init:
        condition: service_completed_successfully
    entrypoint: ["sh", "/init/start_logto.sh"]
    ports:
      - "3011:3001"
      - "3002:3002"
    environment:
      TRUST_PROXY_HEADER: 1
      ENDPOINT: ${LOGTO_ENDPOINT}
      ADMIN_ENDPOINT: ${LOGTO_ADMIN_ENDPOINT}
      LOGTO_POSTGRES_PASSWORD_FILE: /run/secrets/logto_postgres_password
    volumes:
      - logto-connectors:/etc/logto/packages/core/connectors
      - ./sql/start_logto.sh:/init/start_logto.sh:ro
    secrets:
      - logto_postgres_password
    restart: unless-stopped

volumes:
  logto-connectors:
  timescaledb-data:

secrets:
  logto_postgres_password:
    environment: LOGTO_POSTGRES_PASSWORD
