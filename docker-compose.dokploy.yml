services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      secrets:
        - hf_token
    image: asm2-backend:latest
    env_file:
      - .env
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      QDRANT_HOST: qdrant
      QDRANT_META_PATH: /app/data/qdrant_meta
      GOOGLE_CLIENT_SECRET_FILE: ${GOOGLE_CLIENT_SECRET_FILE:-/app/secrets/client_secret.json}
      PG_HOST: timescaledb
      PG_PORT: 5432
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
    volumes:
      - backend-data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      timescaledb-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8001/healthz || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - asm2-internal

  qdrant:
    image: qdrant/qdrant:gpu-nvidia-latest
    environment:
      QDRANT__GPU__INDEXING: "1"
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - asm2-internal

  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile.caddy
      args:
        VITE_BACKEND_URL: /api
        LOGTO_ENDPOINT: ${LOGTO_ENDPOINT}
        LOGTO_APP_ID: ${LOGTO_APP_ID}
        LOGTO_API_RESOURCE: ${LOGTO_API_RESOURCE}
    image: asm2-dashboard:latest
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1/ >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - asm2-internal
      - dokploy-network

  timescaledb:
    image: timescale/timescaledb:2.28.3-pg18
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - timescaledb-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    networks:
      - asm2-internal

  timescaledb-init:
    image: postgres:18-alpine
    restart: "no"
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - ./sql/init_tsdb.sql:/init/init_tsdb.sql:ro
      - ./sql/init_tsdb.sh:/init/init_tsdb.sh:ro
    env_file:
      - .env
    working_dir: /init
    entrypoint: ["sh", "/init/init_tsdb.sh"]
    environment:
      LOGTO_POSTGRES_PASSWORD_FILE: /run/secrets/logto_postgres_password
      PG_HOST: timescaledb
      PG_PORT: 5432
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
    secrets:
      - logto_postgres_password
    networks:
      - asm2-internal

  logto:
    image: ghcr.io/logto-io/logto:1.38.0
    depends_on:
      timescaledb-init:
        condition: service_completed_successfully
    entrypoint: ["sh", "/init/start_logto.sh"]
    ports:
      - "3001"
      - "3002"
    env_file:
      - .env
    environment:
      TRUST_PROXY_HEADER: 1
      ENDPOINT: ${LOGTO_ENDPOINT}
      ADMIN_ENDPOINT: ${LOGTO_ADMIN_ENDPOINT}
      LOGTO_POSTGRES_PASSWORD_FILE: /run/secrets/logto_postgres_password
    volumes:
      - logto-connectors:/etc/logto/packages/core/connectors
      - ./sql/start_logto.sh:/init/start_logto.sh:ro
    secrets:
      - logto_postgres_password
    restart: unless-stopped
    networks:
      - asm2-internal
      - dokploy-network

volumes:
  backend-data:
  qdrant-data:
  timescaledb-data:
  logto-connectors:

secrets:
  hf_token:
    environment: HF_TOKEN
  logto_postgres_password:
    environment: LOGTO_POSTGRES_PASSWORD

networks:
  asm2-internal:
  dokploy-network:
    external: true
