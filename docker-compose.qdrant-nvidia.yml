# Qdrant NVIDIA GPU override configuration
# Usage:
#   - Base stack only: docker compose -f docker-compose.yml -f docker-compose.qdrant-nvidia.yml up
#   - Local infra: docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.qdrant-nvidia.yml up
#   - Helper script: ./run.sh up --qdrant nvidia
services:
  qdrant:
    image: qdrant/qdrant:v1.16.2-gpu-nvidia
    environment:
      # enable GPU indexing inside Qdrant
      - QDRANT__GPU__INDEXING=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
