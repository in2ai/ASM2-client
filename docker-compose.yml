services:
  app:
    build: .
    image: mi-streamlit:latest
    container_name: mi-streamlit
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./faiss_index:/app/faiss_index:rw
      - ./secrets/client_secret.json:/app/client_secret.json:ro
      - ./secrets/client_secret_website.json:/app/client_secret_website.json:ro
      - ./img:/app/img:rw
      - ./src:/app/src:rw
      - ./app.py:/app/app.py:rw
    user: "${UID}:${GID}"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8501/_stcore/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  questdb:
    image: questdb/questdb:latest
    container_name: questdb
    restart: unless-stopped
    # Ports:
    # 9000 - QuestDB web console / REST API (HTTP)
    # 8812 - Postgres wire protocol (useable with psql / Postgres clients / SQL interfaces)
    # 9009 - InfluxDB Line Protocol (ILP)
    ports:
      - "9000:9000"
      - "8812:8812"
      - "9009:9009"
    volumes:
      - ./questdb:/root/.questdb:rw
    env_file:
      - .env

  questdb-init:
    image: postgres:15-alpine
    container_name: questdb-init
    restart: "no"
    depends_on:
      - questdb
    volumes:
      - ./sql/init.sql:/init/init.sql:ro
      - ./sql/init.sh:/init/init.sh:ro
    env_file:
      - .env
    working_dir: /init
    entrypoint: ["sh", "/init/init.sh"]

  logto-db:
    image: postgres:15-alpine
    container_name: logto-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: logto
      POSTGRES_USER: logto
      POSTGRES_PASSWORD: ${LOGTO_DB_PASSWORD}
    volumes:
      - logto_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logto -d logto"]
      interval: 10s
      timeout: 5s
      retries: 5

  logto:
    image: ghcr.io/logto-io/logto:latest
    container_name: logto
    restart: unless-stopped
    depends_on:
      logto-db:
        condition: service_healthy
    ports:
      - "3002:3002"
    environment:
      TRUST_PROXY_HEADER: "1"
      DB_URL: postgres://logto:${LOGTO_DB_PASSWORD}@logto-db:5432/logto
      ENDPOINT: http://logto:3001
      ADMIN_ENDPOINT: http://localhost:3002

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: dashboard:latest
    container_name: dashboard
    depends_on:
      - questdb
      - logto
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - LOGTO_ENDPOINT=http://logto:3001
      - LOGTO_APP_ID=${LOGTO_APP_ID}
      - LOGTO_APP_SECRET=${LOGTO_APP_SECRET}
      - LOGTO_COOKIE_SECRET=${LOGTO_COOKIE_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    restart: unless-stopped

volumes:
  logto_postgres_data:
