services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: asm2-backend:latest
    env_file:
      - .env
    environment:
      CHAT_DB_PATH: /app/data/chat_history.sqlite3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    volumes:
      - ./qdrant_index:/app/qdrant_index:rw
      - ./secrets:/app/secrets:ro
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8001/healthz || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333" # HTTP / REST API
      - "6334:6334" # gRPC
    volumes:
      - ./qdrant_index:/qdrant/storage

  dashboard:
    build:
      context: ./dashboard-ts-router
      dockerfile: Dockerfile.caddy
      args:
        VITE_BACKEND_URL: /api
        VITE_LOGTO_ENDPOINT: ${VITE_LOGTO_ENDPOINT}
        VITE_LOGTO_APP_ID: ${VITE_LOGTO_APP_ID}
        VITE_LOGTO_API_RESOURCE: ${VITE_LOGTO_API_RESOURCE}
    image: asm2-dashboard:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1/ >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  backend-data:
