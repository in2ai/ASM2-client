services:
  app:
    build: .
    image: mi-streamlit:latest
    container_name: mi-streamlit
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./qdrant_index:/app/qdrant_index:rw
      - ./secrets/client_secret.json:/app/client_secret.json:ro
      - ./secrets/client_secret_website.json:/app/client_secret_website.json:ro
      - ./img:/app/img:rw
      - ./src:/app/src:rw
      - ./app.py:/app/app.py:rw
    user: "${UID}:${GID}"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8501/_stcore/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

  questdb:
    image: questdb/questdb:latest
    container_name: questdb
    restart: unless-stopped
    # Ports:
    # 9000 - QuestDB web console / REST API (HTTP)
    # 8812 - Postgres wire protocol (useable with psql / Postgres clients / SQL interfaces)
    # 9009 - InfluxDB Line Protocol (ILP)
    ports:
      - "9000:9000"
      - "8812:8812"
      - "9009:9009"
    volumes:
      - ./questdb:/root/.questdb:rw
    env_file:
      - .env

  questdb-init:
    image: postgres:15-alpine
    container_name: questdb-init
    restart: "no"
    depends_on:
      - questdb
    volumes:
      - ./sql/init.sql:/init/init.sql:ro
      - ./sql/init.sh:/init/init.sh:ro
    env_file:
      - .env
    working_dir: /init
    entrypoint: ["sh", "/init/init.sh"]

  qdrant:
    image: qdrant/qdrant:gpu-nvidia-latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP / REST API
      - "6334:6334"   # gRPC
    environment:
      # enable GPU indexing inside Qdrant
      - QDRANT__GPU__INDEXING=1
    volumes:
      - ./qdrant_index:/qdrant/storage
    gpus: all

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_WORKOS_REDIRECT_URI=${NEXT_PUBLIC_WORKOS_REDIRECT_URI}
    image: dashboard:latest
    container_name: dashboard
    depends_on:
      - questdb
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped