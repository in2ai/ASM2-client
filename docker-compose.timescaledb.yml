# Local TimescaleDB override configuration
# Applied in both --local and --remote modes: the database always runs next to
# the stack, so no mode talks to a deployed TimescaleDB.
# Usage:
#   - Remote mode: docker compose -f docker-compose.yml -f docker-compose.timescaledb.yml up
#   - Local infra: docker compose -f docker-compose.yml -f docker-compose.timescaledb.yml -f docker-compose.local.yml up
#   - Helper script: ./run.sh up --remote
services:
  backend:
    environment:
      PG_HOST: timescaledb
      PG_PORT: 5432
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
    depends_on:
      timescaledb:
        condition: service_healthy
      timescaledb-init:
        condition: service_completed_successfully

  timescaledb:
    image: timescale/timescaledb:2.28.3-pg18
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - timescaledb-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}

  # Applies the application schema. The Logto role and database are only
  # bootstrapped when docker-compose.local.yml hands this service a password.
  timescaledb-init:
    image: postgres:18-alpine
    restart: "no"
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - ./sql/init_tsdb.sql:/init/init_tsdb.sql:ro
      - ./sql/init_tsdb.sh:/init/init_tsdb.sh:ro
    env_file:
      - .env
    working_dir: /init
    entrypoint: ["sh", "/init/init_tsdb.sh"]
    environment:
      PG_HOST: timescaledb
      PG_PORT: 5432
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}

volumes:
  timescaledb-data:
