# Qdrant AMD GPU override configuration
# Usage:
#   - Base stack only: docker compose -f docker-compose.yml -f docker-compose.qdrant-amd.yml up
#   - Local infra: docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.qdrant-amd.yml up
#   - Helper script: ./run.sh up --qdrant amd
services:
  qdrant:
    image: qdrant/qdrant:v1.16.2-gpu-amd
    environment:
      # enable GPU indexing inside Qdrant
      - QDRANT__GPU__INDEXING=1
    devices:
      - /dev/kfd:/dev/kfd # AMD Kernel Fusion Driver
      - /dev/dri:/dev/dri # Direct Rendering Infrastructure
    group_add:
      - ${VIDEO_GID:?VIDEO_GID must be set to the host video group ID}
      - ${RENDER_GID:?RENDER_GID must be set to the host render group ID}
