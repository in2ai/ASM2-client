# GPU override configuration for the backend service.
# Usage:
#   - Base stack only: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
#   - Local infra: docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.gpu.yml up
#   - Helper script: ./run.sh up --gpu
services:
  backend:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
