services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: asm2-backend:latest
    container_name: backend
    env_file:
      - .env
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8000/healthz || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard-ts-router
      dockerfile: Dockerfile.caddy
      args:
        VITE_BACKEND_URL: /api
        VITE_LOGTO_ENDPOINT: ${LOGTO_ENDPOINT}
        VITE_LOGTO_APP_ID: ${LOGTO_APP_ID}
        VITE_LOGTO_API_RESOURCE: ${LOGTO_API_RESOURCE}
    image: dashboard-spa:caddy
    container_name: dashboard
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1/ >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
