allowBuilds:
  esbuild: true
  msw: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@tanstack/react-router@1.170.11'
  - '@tanstack/router-core@1.171.9'
  - '@tanstack/query-core@5.101.0'
  - '@tanstack/react-query@5.101.0'
  - '@tanstack/router-generator@1.167.13'
  - '@tanstack/router-plugin@1.168.14'
# Pinned, not `latest`: resolving the toolchain at install time meant any
# install could silently move every developer and CI onto a different compiler,
# formatter and test runner -- in one case backwards, onto a prerelease.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.1.24
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.24
  vite-plus: 0.1.24
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
