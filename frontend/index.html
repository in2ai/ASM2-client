<!doctype html>
<!-- lang is corrected at runtime from the chosen locale; see src/i18n/provider.tsx -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASM2</title>
    <meta
      name="description"
      content="ASM2 — asistente documental y panel de métricas."
    />
    <!-- Matches the app background on each side, so mobile browser chrome
         does not sit as a bright strip above a dark app. -->
    <meta
      name="theme-color"
      content="#fbfaf8"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0c1016"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Geist is bundled with the app, and the build preloads it here; see
         `preloadBodyFont` in vite.config.ts. -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
